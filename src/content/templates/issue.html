<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{COMPANY_NAME}}</title>
<style>
  body{margin:0;background:#f4f5f7;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#1c1f24;line-height:1.55}
  .wrap{max-width:680px;margin:0 auto;padding:24px 16px}
  .card{background:#fff;border-radius:8px;padding:28px 28px 20px;border:1px solid #e3e6ea}
  h1{font-size:22px;margin:0 0 6px}
  h2{font-size:17px;margin:28px 0 8px;border-bottom:1px solid #e3e6ea;padding-bottom:4px}
  h3{font-size:15px;margin:18px 0 4px}
  p{margin:6px 0}
  a{color:#0b5fff}
  ul{padding-left:20px}
  .foot{font-size:12px;color:#6b7280;margin-top:24px;text-align:center}
  .foot a{color:#6b7280}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    {{BODY}}
  </div>
  <div class="foot">
    <p>{{COMPANY_NAME}} · {{COMPANY_ADDRESS}}</p>
    <p>You receive this because your organisation subscribes. <a href="{{UNSUBSCRIBE_URL}}">Unsubscribe</a> · <a href="{{SITE_URL}}">Website</a></p>
  </div>
</div>
</body>
</html>
